name: snake

# The contribution snake is generated here rather than fetched from a third-party
# renderer: those free instances go down (github-readme-activity-graph and
# profile-trophy both return 402 right now) and take the profile's images with them.
# This commits the SVG into the repo, so the README can never render broken.
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day is enough; the graph only changes on commit
  workflow_dispatch:          # lets you generate it immediately instead of waiting
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # required to push to the `output` branch
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # `output` is a detached branch holding only the SVGs, so the generated
      # images never show up as noise in main's history.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
